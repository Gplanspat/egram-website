<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultant Registration Form | eGram</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f7f9fc; margin: 0; padding: 20px; }
        .consultant-container { max-width: 650px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .selected-position-summary { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; color: #1d4ed8; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 5px; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
        .password-box { position: relative; }
        .password-box input { width: 100%; box-sizing: border-box; padding-right: 40px; }
        #togglePassword { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; }
        .upload-btn { display: block; padding: 12px; background: #f8fafc; border: 1px dashed #2563eb; text-align: center; border-radius: 8px; cursor: pointer; color: #2563eb; font-weight: bold; }
        button[type="submit"] { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button[type="submit"]:disabled { background: #93c5fd; cursor: not-allowed; }
        .back-link { text-decoration: none; color: #2563eb; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="consultant-container">
    <a href="consultant-registration.html" class="back-link">← Back to Positions</a>

    <h2>Consultant Registration</h2>

    <div class="selected-position-summary">
        Selected Position: <strong id="selectedPosition">Loading...</strong>
    </div>

    <form id="consultantRegistrationForm">
        <input type="hidden" id="selectedState" name="selected_state">
        <input type="hidden" id="selectedPositionNumber" name="position_number">
        <input type="hidden" id="selectedPositionId" name="position_id">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" required placeholder="08012345678">
        </div>

        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" name="whatsapp" placeholder="08012345678">
        </div>

        <div class="form-group">
            <label>Occupation</label>
            <input type="text" name="occupation" required placeholder="Education Consultant">
        </div>

        <div class="form-group">
            <label>State of Residence</label>
            <input type="text" name="state_of_residence" required placeholder="e.g. Lagos">
        </div>

        <div class="form-group">
            <label>Residential Address</label>
            <textarea name="address" rows="3" required placeholder="Enter full address"></textarea>
        </div>

        <div class="form-group">
            <label>Create Password</label>
            <div class="password-box">
                <input type="password" id="password" name="password" required>
                <span id="togglePassword">👁️</span>
            </div>
        </div>

        <div class="selected-position-summary" style="text-align: left; background: #fff8f1; border-color: #ffedd5; color: #9a3412;">
            <strong>Bank Transfer Details:</strong><br>
            Bank: Moniepoint MFB<br>
            Account Name: Spatcan Development Company Limited<br>
            Account Number: 4005624798<br>
            Amount: ₦250,000
        </div>

        <div class="form-group">
            <label>Payment Receipt (Required)</label>
            <label class="upload-btn" for="paymentProof">Upload Bank Payment Receipt</label>
            <input type="file" id="paymentProof" accept="image/*,.pdf" required hidden>
            <small id="fileName" style="margin-top: 5px; color: #6b7280;">No file selected</small>
        </div>

        <button type="submit" id="submitBtn">Submit Registration</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const state = params.get("state");
const position = params.get("position");
const positionId = params.get("position_id");

document.getElementById("selectedPosition").textContent = `${state} — Position ${position}`;
document.getElementById("selectedState").value = state;
document.getElementById("selectedPositionNumber").value = position;
document.getElementById("selectedPositionId").value = positionId || "";

// Toggle Password
const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");
toggleBtn.onclick = () => {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleBtn.textContent = "🙈";
    } else {
        passwordInput.type = "password";
        toggleBtn.textContent = "👁️";
    }
};

// Payment Receipt Selection display
const paymentInput = document.getElementById("paymentProof");
const fileNameDisplay = document.getElementById("fileName");

paymentInput.addEventListener("change", () => {
    fileNameDisplay.textContent = paymentInput.files.length 
        ? paymentInput.files[0].name 
        : "No file selected";
});

// Form Submission logic
document.getElementById("consultantRegistrationForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");

    // 1. Check Receipt Upload BEFORE doing anything
    const proofFile = paymentInput.files[0];
    if (!proofFile) {
        alert("Please upload a bank payment receipt before submitting your registration.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Processing Registration...";

    try {
        const formData = new FormData(e.target);
        const email = formData.get("email");
        const password = formData.get("password");
        const fullName = formData.get("full_name");
        
        // Ensure valid positionId
        let parsedPositionId = positionId ? parseInt(positionId) : null;

        // If positionId wasn't passed in query string, fetch it now
        if (!parsedPositionId) {
            const { data: posData } = await supabaseClient
                .from("consultant_positions")
                .select("id")
                .eq("state", state)
                .eq("position_number", parseInt(position))
                .single();
            if (posData) parsedPositionId = posData.id;
        }

        // 2. Sign Up User in Supabase Auth
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (authError) throw authError;

        // 3. Upload Payment Receipt
        const fileExt = proofFile.name.split('.').pop();
        const filePath = `${authData.user.id}-${Date.now()}.${fileExt}`;
        
        const { error: uploadError } = await supabaseClient.storage
            .from("consultant-receipts")
            .upload(filePath, proofFile);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
            .from("consultant-receipts")
            .getPublicUrl(filePath);

        // 4. Save Consultant Application Record
        const applicationData = {
            user_id: authData.user.id,
            full_name: fullName,
            email: email,
            phone: formData.get("phone"),
            whatsapp: formData.get("whatsapp"),
            occupation: formData.get("occupation"),
            state_of_residence: formData.get("state_of_residence"),
            address: formData.get("address"),
            selected_state: state,
            position_number: parseInt(position),
            position_id: parsedPositionId,
            payment_proof: publicUrlData.publicUrl,
            payment_status: "pending",
            application_status: "pending"
        };

        const { error: appError } = await supabaseClient
            .from("consultant_applications")
            .insert([applicationData]);

        if (appError) throw appError;

        // 5. Update Position Box to 'HELD' & Set Applicant Name
        if (parsedPositionId) {
            await supabaseClient
                .from("consultant_positions")
                .update({ 
                    status: "held",
                    applicant_name: fullName 
                })
                .eq("id", parsedPositionId);
        } else {
            await supabaseClient
                .from("consultant_positions")
                .update({ 
                    status: "held",
                    applicant_name: fullName 
                })
                .eq("state", state)
                .eq("position_number", parseInt(position));
        }

        alert("Registration submitted successfully! Your position is now held pending admin approval.");
        window.location.href = "consultant-dashboard.html";

    } catch (err) {
        alert("Registration failed: " + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Registration";
    }
});
</script>


</body>
</html>
