<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultant Login | eGram</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.card{
background:#fff;
padding:30px;
width:360px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}
h2{text-align:center;color:#2563eb;}
input{
width:100%;
padding:13px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}
button{
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}
small{
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<h2>Consultant Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<div style="position:relative;">
  <input
    type="password"
    id="password"
    placeholder="Password"
    required
    style="padding-right:45px;">

  <span
    id="togglePassword"
    style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px;">
    👁️
  </span>
</div>

<button type="submit">
Login
</button>

</form>

<small>
Don't have an account?
<a href="consultant-registration.html">
Register
</a>
</small>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
document
.getElementById("loginForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
alert(error.message);
return;
}

window.location.href="consultant-dashboard.html";

});

const toggle = document.getElementById("togglePassword");
const password = document.getElementById("password");

toggle.addEventListener("click", () => {
  if (password.type === "password") {
    password.type = "text";
    toggle.textContent = "🙈";
  } else {
    password.type = "password";
    toggle.textContent = "👁️";
  }
});
</script>

</body>
</html>
